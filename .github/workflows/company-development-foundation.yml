name: Company development foundation preview

# PREPARATION ONLY. Review this new route before activation. It has no deploy
# operation, bootstrap, provider registration, SQL, images, apps or jobs.
# GitHub company-dev required-reviewer approval is the authoritative gate.
# Independent manual no-bypass verification for this exact SHA/run/snapshot must
# be recorded in that approval; no repository flag is a replacement.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Seven-write bootstrap or human-handoff-verified existing-reference continuation
        required: true
        type: choice
        options: [bootstrap, continuation]
      mode:
        description: Initial stage or exact inventory/terminal-operations reviewed recovery or no-op
        required: true
        type: choice
        options: [initial, reviewed-reentry]
      evidence_version:
        description: Staged evidence schema (legacy full plans are rejected)
        required: true
        type: choice
        options: ["2"]
      change_freeze:
        description: External owner-controlled change-freeze review reference (not an approval assertion)
        required: true
        type: string
      stage_context:
        description: Reviewed JSON baseline, immutable predecessor and human security/functional references; omit only for initial bootstrap
        required: false
        type: string
      vnet_cidr:
        description: Network-owner-approved RFC1918 VNet CIDR (no default)
        required: true
        type: string
      aca_subnet_cidr:
        description: Approved ACA infrastructure /26 within that VNet
        required: true
        type: string
      postgres_subnet_cidr:
        description: Approved separate PostgreSQL /28 within that VNet
        required: true
        type: string
      network_approval:
        description: Repository issue or PR URL recording network-owner approval
        required: true
        type: string

permissions:
  contents: read

env:
  FOUNDATION_STAGE: ${{ inputs.stage }}
  FOUNDATION_MODE: ${{ inputs.mode }}
  EVIDENCE_VERSION: ${{ inputs.evidence_version }}
  CHANGE_FREEZE: ${{ inputs.change_freeze }}
  STAGE_CONTEXT: ${{ inputs.stage_context }}

concurrency:
  group: company-dev-foundation
  cancel-in-progress: false

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # GET environment protection metadata; no settings writes
    outputs:
      review_context: ${{ steps.review-context.outputs.review_context }}
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify externally configured route activation and reviewers
        id: review-context
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANY_DEV_PLAN_ENABLED: ${{ vars.COMPANY_DEV_PLAN_ENABLED }}
        run: node scripts/infra/company-development.mjs guard

  plan:
    needs: [guard]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: company-dev
    permissions:
      contents: read
      actions: read # Recheck environment snapshot after GitHub approval, before OIDC
      id-token: write
    env:
      PREVIEW_CLIENT_ID: ${{ vars.COMPANY_DEV_PLAN_CLIENT_ID }}
      REVIEW_CONTEXT: ${{ needs.guard.outputs.review_context }}
      VNET_CIDR: ${{ inputs.vnet_cidr }}
      ACA_SUBNET_CIDR: ${{ inputs.aca_subnet_cidr }}
      POSTGRES_SUBNET_CIDR: ${{ inputs.postgres_subnet_cidr }}
      NETWORK_APPROVAL: ${{ inputs.network_approval }}
      APPROVED_VNET_CIDR: ${{ vars.COMPANY_DEV_APPROVED_VNET_CIDR }}
      APPROVED_ACA_SUBNET_CIDR: ${{ vars.COMPANY_DEV_APPROVED_ACA_SUBNET_CIDR }}
      APPROVED_POSTGRES_SUBNET_CIDR: ${{ vars.COMPANY_DEV_APPROVED_POSTGRES_SUBNET_CIDR }}
      APPROVED_NETWORK_REFERENCE: ${{ vars.COMPANY_DEV_NETWORK_APPROVAL_REFERENCE }}
    steps:
      - name: Check out approved immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate explicit destination network inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/infra/company-development.mjs prepare
      - name: Sign in with destination-only preview federation
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ env.PREVIEW_CLIENT_ID }}
          tenant-id: 8019a048-e7d6-48e8-984a-b902f641a21b
          subscription-id: 891e5e6e-8ae3-4455-9184-8d7606223d91
      - name: Compile and preview exact stage inventory and human handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/infra/company-development.mjs preview
      - name: Preserve SHA-bound preparation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: company-dev-foundation-${{ inputs.stage }}-${{ inputs.mode }}-v2-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            company-dev-plan/evidence.json
            company-dev-plan/inputs.json
            company-dev-plan/parameters.json
            company-dev-plan/review-context.json
            company-dev-plan/template.json
            company-dev-plan/what-if.json
            company-dev-plan/inventory.json
          if-no-files-found: error
          retention-days: 7
