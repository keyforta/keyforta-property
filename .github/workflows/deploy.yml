name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from main; defaults to the selected main revision
        required: false
        type: string
      operation:
        description: Preview first; bootstrap a fresh foundation or deploy a reviewed component plan
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy-foundation
          - deploy
      deployment_scope:
        description: Component resources to preview or deploy
        required: true
        default: full
        type: choice
        options:
          - full
          - postgres
          - api
          - public-web
          - portal-web
          - admin-web
          - mcp
      plan_run_id:
        description: Successful plan workflow run ID for this exact SHA; required for deploy
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      DBA_CLIENT_IP: ${{ vars.POSTGRES_DBA_CLIENT_IP }}
      DBA_OBJECT_ID: ${{ vars.POSTGRES_DBA_OBJECT_ID }}
      DBA_PRINCIPAL_NAME: ${{ vars.POSTGRES_DBA_PRINCIPAL_NAME }}
      DBA_PRINCIPAL_TYPE: ${{ vars.POSTGRES_DBA_PRINCIPAL_TYPE || 'User' }}
      DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}
      DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
      ENVIRONMENT: dev
      RESOURCE_GROUP: rg-keyforta-dev-san
      WEB_CANONICAL_HOST: keyforta.com
      WEB_WWW_HOST: www.keyforta.com
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Verify revision belongs to main
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOYMENT_SHA" origin/main

      - name: Verify deployment scope capability
        run: |
          case "$DEPLOYMENT_SCOPE" in
            api|full|postgres|public-web) ;;
            admin-web|mcp|portal-web)
              echo "Deployment scope '$DEPLOYMENT_SCOPE' is reserved but has no approved image and Azure resource definition yet." >&2
              exit 1
              ;;
            *)
              echo "Unknown deployment scope '$DEPLOYMENT_SCOPE'." >&2
              exit 1
              ;;
          esac

      - name: Verify deployment intent
        if: inputs.operation != 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          if ! [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Deployment requires the numeric run ID of a reviewed plan." >&2
            exit 1
          fi
          run=$(gh run view "$PLAN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,event,workflowName)
          test "$(jq -r '.conclusion' <<< "$run")" = "success"
          test "$(jq -r '.event' <<< "$run")" = "workflow_dispatch"
          test "$(jq -r '.workflowName' <<< "$run")" = "Deploy"
          mkdir plan-evidence
          gh run download "$PLAN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "deployment-plan-$DEPLOYMENT_SHA" \
            --dir plan-evidence
          grep -Fx "commit_sha=$DEPLOYMENT_SHA" plan-evidence/deployment-plan.txt
          grep -Fx "operation=plan" plan-evidence/deployment-plan.txt
          grep -Fx "run_id=$PLAN_RUN_ID" plan-evidence/deployment-plan.txt
          if [ "$OPERATION" = "deploy-foundation" ]; then
            expected_scope=foundation
          else
            expected_scope="$DEPLOYMENT_SCOPE"
          fi
          grep -Fx "scope=$expected_scope" plan-evidence/deployment-plan.txt

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Determine deployment plan scope
        id: foundation-state
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            if az deployment group show \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-foundation" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "PLAN_SCOPE=$DEPLOYMENT_SCOPE" >> "$GITHUB_ENV"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "PLAN_SCOPE=foundation" >> "$GITHUB_ENV"
            fi

      - name: Preview foundation changes
        if: inputs.operation == 'deploy-foundation' || (inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'false')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-foundation" \
              --template-file infra/bicep/foundation.bicep \
              --parameters "@infra/config/${ENVIRONMENT}.parameters.json" \
              --parameters azureTenantId="${{ vars.AZURE_TENANT_ID }}"

      - name: Deploy foundation
        if: inputs.operation == 'deploy-foundation'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-foundation" \
              --template-file infra/bicep/foundation.bicep \
              --parameters "@infra/config/${ENVIRONMENT}.parameters.json" \
              --parameters azureTenantId="${{ vars.AZURE_TENANT_ID }}"

      - name: Load foundation outputs
        if: inputs.operation == 'deploy' || (inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            outputs=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "keyforta-${ENVIRONMENT}-foundation" --query properties.outputs -o json)
            echo "REGISTRY_NAME=$(echo "$outputs" | jq -r '.registryName.value')" >> "$GITHUB_ENV"
            echo "REGISTRY_SERVER=$(echo "$outputs" | jq -r '.registryLoginServer.value')" >> "$GITHUB_ENV"
            echo "APP_ENVIRONMENT=$(echo "$outputs" | jq -r '.containerAppsEnvironmentName.value')" >> "$GITHUB_ENV"
            echo "POSTGRES_SERVER=$(echo "$outputs" | jq -r '.postgresServerName.value')" >> "$GITHUB_ENV"
            echo "API_IDENTITY=$(echo "$outputs" | jq -r '.apiIdentityName.value')" >> "$GITHUB_ENV"
            echo "MIGRATION_IDENTITY=$(echo "$outputs" | jq -r '.migrationIdentityName.value')" >> "$GITHUB_ENV"
            echo "MIGRATION_PRINCIPAL_ID=$(echo "$outputs" | jq -r '.migrationIdentityPrincipalId.value')" >> "$GITHUB_ENV"
            echo "WEB_IDENTITY=$(echo "$outputs" | jq -r '.webIdentityName.value')" >> "$GITHUB_ENV"
            echo "DOCUMENT_STORAGE_ACCOUNT=$(echo "$outputs" | jq -r '.documentStorageAccountName.value')" >> "$GITHUB_ENV"
            echo "TENANT_APPLICATION_CONTAINER=$(echo "$outputs" | jq -r '.tenantApplicationContainerName.value')" >> "$GITHUB_ENV"

      - name: Verify PostgreSQL DBA access configuration
        if: (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres') && (inputs.operation == 'deploy' || (inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true'))
        run: |
          if [ -z "$DBA_CLIENT_IP" ] && [ -z "$DBA_OBJECT_ID" ] && [ -z "$DBA_PRINCIPAL_NAME" ]; then
            exit 0
          fi
          test -n "$DBA_CLIENT_IP"
          test -n "$DBA_OBJECT_ID"
          test -n "$DBA_PRINCIPAL_NAME"
          case "$DBA_PRINCIPAL_TYPE" in
            User|Group) ;;
            *) echo "POSTGRES_DBA_PRINCIPAL_TYPE must be User or Group" >&2; exit 1 ;;
          esac

      - name: Preview database access changes
        if: inputs.operation != 'deploy-foundation' && steps.foundation-state.outputs.exists == 'true' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-database-access" \
              --template-file infra/bicep/database-access.bicep \
              --parameters postgresServerName="$POSTGRES_SERVER" \
                azureTenantId="${{ vars.AZURE_TENANT_ID }}" \
                administratorObjectId="$MIGRATION_PRINCIPAL_ID" \
                administratorPrincipalName="$MIGRATION_IDENTITY" \
                dbaObjectId="$DBA_OBJECT_ID" \
                dbaPrincipalName="$DBA_PRINCIPAL_NAME" \
                dbaPrincipalType="$DBA_PRINCIPAL_TYPE" \
                dbaClientIpAddress="$DBA_CLIENT_IP"

      - name: Preview database job changes
        if: inputs.operation != 'deploy-foundation' && steps.foundation-state.outputs.exists == 'true' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-migration-job" \
              --template-file infra/bicep/migration-job.bicep \
              --parameters environment="$ENVIRONMENT" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                migrationIdentityName="$MIGRATION_IDENTITY" \
                apiIdentityName="$API_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA"
      - name: Preview development seed job changes
        if: inputs.operation != 'deploy-foundation' && steps.foundation-state.outputs.exists == 'true' && env.DEPLOYMENT_SCOPE == 'full'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-seed-job" \
              --template-file infra/bicep/seed-job.bicep \
              --parameters environment="$ENVIRONMENT" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                migrationIdentityName="$MIGRATION_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA"

      - name: Configure PostgreSQL Entra administrator
        if: inputs.operation == 'deploy' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-database-access" \
              --template-file infra/bicep/database-access.bicep \
              --parameters postgresServerName="$POSTGRES_SERVER" \
                azureTenantId="${{ vars.AZURE_TENANT_ID }}" \
                administratorObjectId="$MIGRATION_PRINCIPAL_ID" \
                administratorPrincipalName="$MIGRATION_IDENTITY" \
                dbaObjectId="$DBA_OBJECT_ID" \
                dbaPrincipalName="$DBA_PRINCIPAL_NAME" \
                dbaPrincipalType="$DBA_PRINCIPAL_TYPE" \
                dbaClientIpAddress="$DBA_CLIENT_IP"

      - name: Build and push immutable images
        if: inputs.operation == 'deploy'
        run: |
          az acr login --name "$REGISTRY_NAME"

          api_status=0
          web_status=0
          api_pid=""
          web_pid=""
          if [ "$DEPLOYMENT_SCOPE" = "api" ] || [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "postgres" ]; then
            docker build --file deployments/azure/docker/api.Dockerfile --tag "$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA" . &
            api_pid=$!
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "public-web" ]; then
            docker build --file deployments/azure/docker/public-web.Dockerfile --tag "$REGISTRY_SERVER/keyforta-public-web:$DEPLOYMENT_SHA" . &
            web_pid=$!
          fi

          if [ -n "$api_pid" ]; then wait "$api_pid" || api_status=$?; fi
          if [ -n "$web_pid" ]; then wait "$web_pid" || web_status=$?; fi

          if [ "$api_status" -ne 0 ]; then
            echo "::error title=API container build failed::docker build exited with status $api_status"
          fi
          if [ "$web_status" -ne 0 ]; then
            echo "::error title=Web container build failed::docker build exited with status $web_status"
          fi
          test "$api_status" -eq 0
          test "$web_status" -eq 0

          if [ "$DEPLOYMENT_SCOPE" = "api" ] || [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "postgres" ]; then
            docker push "$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA"
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "public-web" ]; then
            docker push "$REGISTRY_SERVER/keyforta-public-web:$DEPLOYMENT_SHA"
          fi

      - name: Deploy migration job
        if: inputs.operation == 'deploy' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-migration-job" \
              --template-file infra/bicep/migration-job.bicep \
              --parameters environment="$ENVIRONMENT" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                migrationIdentityName="$MIGRATION_IDENTITY" \
                apiIdentityName="$API_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA"

      - name: Apply database migrations
        if: inputs.operation == 'deploy' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        run: |
          execution=$(az containerapp job start \
            --name "caj-keyforta-${ENVIRONMENT}-migration" \
            --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)
          for attempt in {1..60}; do
            result=$(az containerapp job execution show \
              --name "caj-keyforta-${ENVIRONMENT}-migration" \
              --job-execution-name "$execution" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.status -o tsv)
            case "$result" in
              Succeeded) exit 0 ;;
              Failed) exit 1 ;;
            esac
            sleep 10
          done
          exit 1

      - name: Deploy dormant development seed job
        if: inputs.operation == 'deploy' && env.DEPLOYMENT_SCOPE == 'full'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-seed-job" \
              --template-file infra/bicep/seed-job.bicep \
              --parameters environment="$ENVIRONMENT" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                migrationIdentityName="$MIGRATION_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA"

      - name: Preview application changes
        if: env.DEPLOYMENT_SCOPE != 'postgres' && (inputs.operation == 'deploy' || (inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true'))
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-apps" \
              --template-file infra/bicep/apps.bicep \
              --parameters environment="$ENVIRONMENT" \
                deploymentScope="$DEPLOYMENT_SCOPE" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                apiIdentityName="$API_IDENTITY" \
                webIdentityName="$WEB_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA" \
                webImage="$REGISTRY_SERVER/keyforta-public-web:$DEPLOYMENT_SHA" \
                databaseUserName="$API_IDENTITY" \
                entraAudience="${{ vars.ENTRA_AUDIENCE }}" \
                entraIssuer="${{ vars.ENTRA_ISSUER }}" \
                entraJwksUri="${{ vars.ENTRA_JWKS_URI }}" \
                documentStorageAccountName="$DOCUMENT_STORAGE_ACCOUNT" \
                tenantApplicationContainerName="$TENANT_APPLICATION_CONTAINER" \
                webCanonicalHostName="$WEB_CANONICAL_HOST" \
                webWwwHostName="$WEB_WWW_HOST"

      - name: Deploy applications
        if: inputs.operation == 'deploy' && env.DEPLOYMENT_SCOPE != 'postgres'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-apps" \
              --template-file infra/bicep/apps.bicep \
              --parameters environment="$ENVIRONMENT" \
                deploymentScope="$DEPLOYMENT_SCOPE" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                apiIdentityName="$API_IDENTITY" \
                webIdentityName="$WEB_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA" \
                webImage="$REGISTRY_SERVER/keyforta-public-web:$DEPLOYMENT_SHA" \
                databaseUserName="$API_IDENTITY" \
                entraAudience="${{ vars.ENTRA_AUDIENCE }}" \
                entraIssuer="${{ vars.ENTRA_ISSUER }}" \
                entraJwksUri="${{ vars.ENTRA_JWKS_URI }}" \
                documentStorageAccountName="$DOCUMENT_STORAGE_ACCOUNT" \
                tenantApplicationContainerName="$TENANT_APPLICATION_CONTAINER" \
                webCanonicalHostName="$WEB_CANONICAL_HOST" \
                webWwwHostName="$WEB_WWW_HOST"

      - name: Smoke test public applications
        if: inputs.operation == 'deploy' && env.DEPLOYMENT_SCOPE != 'postgres'
        run: |
          web_url="https://${WEB_CANONICAL_HOST}"
          if [ "$DEPLOYMENT_SCOPE" != "api" ]; then
            curl --fail --retry 12 --retry-all-errors --retry-delay 10 "${web_url}/"
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
              --head \
              --dump-header www-headers.txt \
              --output /dev/null \
              "https://${WEB_WWW_HOST}/"
            tr -d '\r' < www-headers.txt \
              | grep -iFx "location: ${web_url}/"
          fi
          if [ "$DEPLOYMENT_SCOPE" != "public-web" ]; then
            api_fqdn=$(az containerapp show \
              --name "ca-keyforta-${ENVIRONMENT}-api" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            api_url="https://${api_fqdn}"
            curl --fail --retry 12 --retry-delay 10 \
              --header "origin: ${web_url}" \
              --dump-header api-headers.txt \
              "${api_url}/ready"
            tr -d '\r' < api-headers.txt \
              | grep -iFx "access-control-allow-origin: ${web_url}"
            curl --fail --silent --show-error \
              --header "origin: ${web_url}" \
              "${api_url}/api/v1/properties?limit=1" > public-properties.json
            node -e '
              const response = JSON.parse(require("node:fs").readFileSync("public-properties.json", "utf8"));
              if (!Array.isArray(response.items) || !Number.isInteger(response.total)) {
                throw new Error("Public property response does not match its contract.");
              }
              const forbidden = ["organizationId", "unitId", "ownerId", "managerId"];
              for (const item of response.items) {
                for (const field of forbidden) {
                  if (field in item) throw new Error(`Public property exposed ${field}.`);
                }
              }
            '
            curl --fail --silent --show-error \
              --header "origin: https://denied.example.test" \
              --dump-header denied-origin-headers.txt \
              --output /dev/null \
              "${api_url}/health"
            ! grep -qi '^access-control-allow-origin:' denied-origin-headers.txt
          fi

          {
            echo "## Dev deployment"
            echo "- Revision: \`${DEPLOYMENT_SHA}\`"
            echo "- Scope: \`${DEPLOYMENT_SCOPE}\`"
            if [ "$DEPLOYMENT_SCOPE" != "api" ]; then
              echo "- Web: ${web_url}"
            fi
            if [ "$DEPLOYMENT_SCOPE" != "public-web" ]; then
              echo "- API: ${api_url}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize deployment plan
        if: inputs.operation == 'plan'
        run: |
          {
            echo "## Dev deployment plan"
            echo "- Revision: \`${DEPLOYMENT_SHA}\`"
            echo "- Scope: \`${PLAN_SCOPE}\`"
            if [ "$PLAN_SCOPE" = "foundation" ]; then
              echo "- Result: foundation what-if completed; dependent resources require the foundation outputs"
              echo "- Next: review this run, then dispatch operation=deploy-foundation for the same SHA and plan run ID"
            else
              echo "- Result: ${PLAN_SCOPE} what-if completed"
              echo "- Next: review this run, then dispatch operation=deploy for the same SHA and plan run ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize foundation bootstrap
        if: inputs.operation == 'deploy-foundation'
        run: |
          {
            echo "## Dev foundation bootstrap"
            echo "- Revision: \`${DEPLOYMENT_SHA}\`"
            echo "- Result: foundation deployed"
            echo "- Next: dispatch operation=plan again to review database jobs and applications"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve SHA-bound deployment plan evidence
        if: inputs.operation == 'plan'
        run: |
          {
            echo "commit_sha=$DEPLOYMENT_SHA"
            echo "operation=plan"
            echo "run_id=$GITHUB_RUN_ID"
            echo "scope=$PLAN_SCOPE"
          } > deployment-plan.txt

      - name: Upload deployment plan evidence
        if: inputs.operation == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-plan-${{ env.DEPLOYMENT_SHA }}
          path: deployment-plan.txt
          if-no-files-found: error
          retention-days: 30
