      - name: Apply database migrations
        if: inputs.operation == 'deploy' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        run: |
          execution=$(az containerapp job start \
            --name "caj-keyforta-${ENVIRONMENT}-migration" \
            --resource-group "$RESOURCE_GROUP" \
            --query name -o tsv)
          echo "MIGRATION_EXECUTION=$execution" >> "$GITHUB_ENV"
          for attempt in {1..96}; do
            result=$(az containerapp job execution show \
              --name "caj-keyforta-${ENVIRONMENT}-migration" \
              --job-execution-name "$execution" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.status -o tsv)
            case "$result" in
              Succeeded) exit 0 ;;
              Failed) exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration execution $execution did not reach a terminal status after the 900-second replica timeout." >&2
          exit 1

