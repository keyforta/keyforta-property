name: Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA from main; defaults to the selected main revision
        required: false
        type: string
      operation:
        description: Preview first; bootstrap a fresh foundation or deploy a reviewed component plan
        required: true
        default: plan
        type: choice
        options:
          - plan
          - deploy-foundation
          - deploy
      deployment_scope:
        description: Component resources to preview or deploy
        required: true
        default: full
        type: choice
        options:
          - full
          - postgres
          - api
          - public-web
          - portal-web
          - admin-web
          - mcp
      plan_run_id:
        description: Successful plan workflow run ID for this exact SHA; required for deploy
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    env:
      DBA_CLIENT_IP: ${{ vars.POSTGRES_DBA_CLIENT_IP }}
      DBA_OBJECT_ID: ${{ vars.POSTGRES_DBA_OBJECT_ID }}
      DBA_PRINCIPAL_NAME: ${{ vars.POSTGRES_DBA_PRINCIPAL_NAME }}
      DBA_PRINCIPAL_TYPE: ${{ vars.POSTGRES_DBA_PRINCIPAL_TYPE || 'User' }}
      DEPLOYMENT_SHA: ${{ inputs.commit_sha || github.sha }}
      DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope }}
      ENVIRONMENT: dev
      AUTHORIZATION_MODULE_ENABLED: ${{ vars.AUTHORIZATION_MODULE_ENABLED || 'true' }}
      PLATFORM_ADMIN_OBJECT_IDS: ${{ vars.PLATFORM_ADMIN_OBJECT_IDS }}
      RESOURCE_GROUP: rg-keyforta-dev-san
      WEB_CANONICAL_HOST: keyforta.com
      WEB_WWW_HOST: www.keyforta.com
      API_CANONICAL_HOST: api.keyforta.com
      ADMIN_CANONICAL_HOST: admin.keyforta.com
      PORTAL_CANONICAL_HOST: portal.keyforta.com
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOYMENT_SHA }}

      - name: Verify revision belongs to main
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOYMENT_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$DEPLOYMENT_SHA" origin/main

      - name: Verify deployment scope capability
        run: |
          case "$DEPLOYMENT_SCOPE" in
            admin-web|api|full|portal-web|postgres|public-web) ;;
            mcp)
              echo "Deployment scope '$DEPLOYMENT_SCOPE' is reserved but has no approved image and Azure resource definition yet." >&2
              exit 1
              ;;
            *)
              echo "Unknown deployment scope '$DEPLOYMENT_SCOPE'." >&2
              exit 1
              ;;
          esac

      - name: Verify deployment intent
        if: inputs.operation != 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          if ! [[ "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Deployment requires the numeric run ID of a reviewed plan." >&2
            exit 1
          fi
          run=$(gh run view "$PLAN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,event,workflowName)
          test "$(jq -r '.conclusion' <<< "$run")" = "success"
          test "$(jq -r '.event' <<< "$run")" = "workflow_dispatch"
          test "$(jq -r '.workflowName' <<< "$run")" = "Deploy"
          mkdir plan-evidence
          gh run download "$PLAN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "deployment-plan-$DEPLOYMENT_SHA" \
            --dir plan-evidence
          grep -Fx "commit_sha=$DEPLOYMENT_SHA" plan-evidence/deployment-plan.txt
          grep -Fx "operation=plan" plan-evidence/deployment-plan.txt
          grep -Fx "run_id=$PLAN_RUN_ID" plan-evidence/deployment-plan.txt
          if [ "$OPERATION" = "deploy-foundation" ]; then
            expected_scope=foundation
          else
            expected_scope="$DEPLOYMENT_SCOPE"
          fi
          grep -Fx "scope=$expected_scope" plan-evidence/deployment-plan.txt
          # Each app has its own hostname-bootstrap field; it is only ever
          # true/false when the deployment scope actually manages that app's
          # hostname (its own scope, or full), otherwise it must be
          # not-applicable (mirrors the original public-web-only check).
          verify_bootstrap_field() {
            field="$1"
            own_scope="$2"
            value=$(sed -n "s/^${field}=//p" plan-evidence/deployment-plan.txt)
            case "$expected_scope:$value" in
              "$own_scope:true"|"$own_scope:false"|full:true|full:false) ;;
              "$own_scope:"*|full:*)
                echo "Plan evidence has an invalid $field value for scope '$expected_scope'." >&2
                exit 1
                ;;
              *:not-applicable) ;;
              *) echo "Plan evidence has an invalid $field value for scope '$expected_scope'." >&2; exit 1 ;;
            esac
            echo "$value"
          }
          echo "EXPECTED_HOSTNAME_BOOTSTRAP=$(verify_bootstrap_field hostname_bootstrap public-web)" >> "$GITHUB_ENV"
          echo "EXPECTED_API_HOSTNAME_BOOTSTRAP=$(verify_bootstrap_field api_hostname_bootstrap api)" >> "$GITHUB_ENV"
          echo "EXPECTED_ADMIN_HOSTNAME_BOOTSTRAP=$(verify_bootstrap_field admin_hostname_bootstrap admin-web)" >> "$GITHUB_ENV"
          echo "EXPECTED_PORTAL_HOSTNAME_BOOTSTRAP=$(verify_bootstrap_field portal_hostname_bootstrap portal-web)" >> "$GITHUB_ENV"

      - name: Sign in to Azure with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify application identity configuration
        env:
          ADMIN_ENTRA_CLIENT_ID: ${{ vars.ADMIN_ENTRA_CLIENT_ID }}
          PORTAL_ENTRA_CLIENT_ID: ${{ vars.PORTAL_ENTRA_CLIENT_ID }}
          ENTRA_API_SCOPE: ${{ vars.ENTRA_API_SCOPE }}
          ENTRA_AUTHORITY: ${{ vars.ENTRA_AUTHORITY }}
          ENTRA_ISSUER: ${{ vars.ENTRA_ISSUER }}
          ENTRA_JWKS_URI: ${{ vars.ENTRA_JWKS_URI }}
          PUBLIC_ENTRA_CLIENT_ID: ${{ vars.PUBLIC_ENTRA_CLIENT_ID }}
        run: |
          [[ "${{ vars.ENTRA_AUDIENCE }}" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$ADMIN_ENTRA_CLIENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          [[ "$PUBLIC_ENTRA_CLIENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "portal-web" ]; then
            [[ "$PORTAL_ENTRA_CLIENT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          fi
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}'
          [[ "$PLATFORM_ADMIN_OBJECT_IDS" =~ ^${uuid}(,${uuid})*$ ]]
          [[ "$ENTRA_AUTHORITY" == https://*.ciamlogin.com/* ]]
          [[ "$ENTRA_API_SCOPE" == api://${{ vars.ENTRA_AUDIENCE }}/* ]]
          [[ "$ENTRA_ISSUER" == https://*.ciamlogin.com/*/v2.0 ]]
          [[ "$ENTRA_JWKS_URI" == https://*.ciamlogin.com/* ]]

          metadata_url="${ENTRA_AUTHORITY%/}/v2.0/.well-known/openid-configuration"
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            "$metadata_url" --output entra-openid-configuration.json
          jq --exit-status \
            --arg issuer "$ENTRA_ISSUER" \
            --arg jwks_uri "$ENTRA_JWKS_URI" \
            '.issuer == $issuer and .jwks_uri == $jwks_uri' \
            entra-openid-configuration.json >/dev/null
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            "$ENTRA_JWKS_URI" | jq --exit-status '.keys | length > 0' >/dev/null

      - name: Determine deployment plan scope
        id: foundation-state
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            if az deployment group show \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-foundation" >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "PLAN_SCOPE=$DEPLOYMENT_SCOPE" >> "$GITHUB_ENV"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "PLAN_SCOPE=foundation" >> "$GITHUB_ENV"
            fi

      - name: Preview foundation changes
        if: inputs.operation == 'deploy-foundation' || (inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'false')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            output_file=foundation-what-if.json
            if [ "${{ inputs.operation }}" = "deploy-foundation" ]; then
              output_file=current-foundation-what-if.json
            fi
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-foundation" \
              --template-file infra/bicep/foundation.bicep \
              --parameters "@infra/config/${ENVIRONMENT}.parameters.json" \
              --parameters azureTenantId="${{ vars.AZURE_TENANT_ID }}" \
              --no-pretty-print \
              --result-format FullResourcePayloads \
              --output json > "$output_file"

      - name: Verify reviewed foundation plan still applies
        if: inputs.operation == 'deploy-foundation'
        run: |
          jq -S '.changes | sort_by(.resourceId)' plan-evidence/foundation-what-if.json > reviewed-foundation-what-if.json
          jq -S '.changes | sort_by(.resourceId)' current-foundation-what-if.json > current-normalized-foundation-what-if.json
          if ! diff -u reviewed-foundation-what-if.json current-normalized-foundation-what-if.json; then
            echo "Foundation resources drifted from the reviewed plan; run a new plan." >&2
            exit 1
          fi

      - name: Deploy foundation
        if: inputs.operation == 'deploy-foundation'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az deployment group create \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-foundation" \
              --template-file infra/bicep/foundation.bicep \
              --parameters "@infra/config/${ENVIRONMENT}.parameters.json" \
              --parameters azureTenantId="${{ vars.AZURE_TENANT_ID }}"

      - name: Load foundation outputs
        if: inputs.operation == 'deploy' || (inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true')
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            outputs=$(az deployment group show --resource-group "$RESOURCE_GROUP" --name "keyforta-${ENVIRONMENT}-foundation" --query properties.outputs -o json)
            echo "REGISTRY_NAME=$(echo "$outputs" | jq -r '.registryName.value')" >> "$GITHUB_ENV"
            echo "REGISTRY_SERVER=$(echo "$outputs" | jq -r '.registryLoginServer.value')" >> "$GITHUB_ENV"
            echo "APP_ENVIRONMENT=$(echo "$outputs" | jq -r '.containerAppsEnvironmentName.value')" >> "$GITHUB_ENV"
            echo "POSTGRES_SERVER=$(echo "$outputs" | jq -r '.postgresServerName.value')" >> "$GITHUB_ENV"
            echo "API_IDENTITY=$(echo "$outputs" | jq -r '.apiIdentityName.value')" >> "$GITHUB_ENV"
            echo "MIGRATION_IDENTITY=$(echo "$outputs" | jq -r '.migrationIdentityName.value')" >> "$GITHUB_ENV"
            echo "MIGRATION_PRINCIPAL_ID=$(echo "$outputs" | jq -r '.migrationIdentityPrincipalId.value')" >> "$GITHUB_ENV"
            echo "WEB_IDENTITY=$(echo "$outputs" | jq -r '.webIdentityName.value')" >> "$GITHUB_ENV"
            echo "DOCUMENT_STORAGE_ACCOUNT=$(echo "$outputs" | jq -r '.documentStorageAccountName.value')" >> "$GITHUB_ENV"
            echo "TENANT_APPLICATION_CONTAINER=$(echo "$outputs" | jq -r '.tenantApplicationContainerName.value')" >> "$GITHUB_ENV"
            default_domain=$(az containerapp env show \
              --name "$(echo "$outputs" | jq -r '.containerAppsEnvironmentName.value')" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.defaultDomain -o tsv)
            echo "APP_DEFAULT_DOMAIN=$default_domain" >> "$GITHUB_ENV"
            echo "API_PUBLIC_BASE_URL=https://ca-keyforta-${ENVIRONMENT}-api.${default_domain}/api/v1" >> "$GITHUB_ENV"
            echo "ADMIN_PUBLIC_BASE_URL=https://ca-keyforta-${ENVIRONMENT}-admin.${default_domain}" >> "$GITHUB_ENV"
            echo "PORTAL_PUBLIC_BASE_URL=https://ca-keyforta-${ENVIRONMENT}-portal.${default_domain}" >> "$GITHUB_ENV"

      - name: Load reviewed application images
        if: inputs.operation == 'deploy'
        run: |
          load_image() {
            key="$1"
            repository="$2"
            value=$(sed -n "s/^${key}=//p" plan-evidence/deployment-plan.txt)
            expected_prefix="$REGISTRY_SERVER/$repository@sha256:"
            digest=${value#"$expected_prefix"}
            if [ "$value" = "$digest" ] || ! [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Plan evidence has an invalid $key reference." >&2
              exit 1
            fi
            printf '%s=%s\n' "${key^^}" "$value" >> "$GITHUB_ENV"
          }

          case "$DEPLOYMENT_SCOPE" in
            full)
              load_image api_image keyforta-api
              load_image web_image keyforta-public-web
              load_image admin_image keyforta-admin-web
              load_image portal_image keyforta-portal-web
              ;;
            api|postgres) load_image api_image keyforta-api ;;
            public-web) load_image web_image keyforta-public-web ;;
            admin-web) load_image admin_image keyforta-admin-web ;;
            portal-web) load_image portal_image keyforta-portal-web ;;
          esac

      - name: Inspect application hostname state
        id: hostname-state
        if: env.DEPLOYMENT_SCOPE != 'postgres' && (inputs.operation == 'deploy' || steps.foundation-state.outputs.exists == 'true')
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          app_hostnames() {
            app_name=$(az containerapp list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?name == 'ca-keyforta-${ENVIRONMENT}-${1}'].name | [0]" -o tsv) || return 1
            if [ -n "$app_name" ]; then
              az containerapp hostname list \
                --name "$app_name" \
                --resource-group "$RESOURCE_GROUP" \
                --query '[].name' -o tsv || return 1
            fi
          }

          web_hostnames=$(app_hostnames web) || {
            echo "Could not discover the public-web Container App's hostnames; refusing to plan against unknown live state." >&2
            exit 1
          }
          canonical_present=false
          www_present=false
          grep -Fxq "$WEB_CANONICAL_HOST" <<< "$web_hostnames" && canonical_present=true
          grep -Fxq "$WEB_WWW_HOST" <<< "$web_hostnames" && www_present=true
          if [ "$canonical_present" = false ] && [ "$www_present" = false ]; then
            web_bootstrap_required=true
          elif [ "$canonical_present" = true ] && [ "$www_present" = true ]; then
            web_bootstrap_required=false
          else
            echo "Expected either zero or both public-web hostnames; refusing a partial-state deployment." >&2
            exit 1
          fi

          single_host_bootstrap_required() {
            hostnames=$(app_hostnames "$1") || return 1
            case "$hostnames" in
              "") echo true ;;
              "$2") echo false ;;
              *)
                echo "Expected zero hostnames or exactly the canonical hostname ($2) for $1; refusing a partial/drifted deployment." >&2
                return 1
                ;;
            esac
          }
          api_bootstrap_required=$(single_host_bootstrap_required api "$API_CANONICAL_HOST") || exit 1
          admin_bootstrap_required=$(single_host_bootstrap_required admin "$ADMIN_CANONICAL_HOST") || exit 1
          portal_bootstrap_required=$(single_host_bootstrap_required portal "$PORTAL_CANONICAL_HOST") || exit 1

          check_drift() {
            name="$1"; actual="$2"; expected="$3"
            if [ "$OPERATION" = "deploy" ] && [ "$actual" != "$expected" ]; then
              echo "Planned hostname bootstrap state '$expected' no longer matches live state '$actual' for $name; run a new plan." >&2
              exit 1
            fi
          }
          case "$DEPLOYMENT_SCOPE" in
            full)
              check_drift web "$web_bootstrap_required" "$EXPECTED_HOSTNAME_BOOTSTRAP"
              check_drift api "$api_bootstrap_required" "$EXPECTED_API_HOSTNAME_BOOTSTRAP"
              check_drift admin-web "$admin_bootstrap_required" "$EXPECTED_ADMIN_HOSTNAME_BOOTSTRAP"
              check_drift portal-web "$portal_bootstrap_required" "$EXPECTED_PORTAL_HOSTNAME_BOOTSTRAP"
              ;;
            public-web) check_drift web "$web_bootstrap_required" "$EXPECTED_HOSTNAME_BOOTSTRAP" ;;
            api) check_drift api "$api_bootstrap_required" "$EXPECTED_API_HOSTNAME_BOOTSTRAP" ;;
            admin-web) check_drift admin-web "$admin_bootstrap_required" "$EXPECTED_ADMIN_HOSTNAME_BOOTSTRAP" ;;
            portal-web) check_drift portal-web "$portal_bootstrap_required" "$EXPECTED_PORTAL_HOSTNAME_BOOTSTRAP" ;;
          esac
          {
            echo "bootstrap-required=$web_bootstrap_required"
            echo "api-bootstrap-required=$api_bootstrap_required"
            echo "admin-bootstrap-required=$admin_bootstrap_required"
            echo "portal-bootstrap-required=$portal_bootstrap_required"
          } >> "$GITHUB_OUTPUT"

      - name: Verify public-web domain preconditions
        if: inputs.operation == 'deploy' && (env.DEPLOYMENT_SCOPE == 'public-web' || env.DEPLOYMENT_SCOPE == 'full')
        run: |
          api_app=$(az containerapp list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name == 'ca-keyforta-${ENVIRONMENT}-api'].name | [0]" -o tsv)
          api_fqdn=''
          if [ -n "$api_app" ]; then
            api_fqdn=$(az containerapp show \
              --name "$api_app" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            if [ -z "$api_fqdn" ]; then
              echo "The existing API Container App has no ingress FQDN." >&2
              exit 1
            fi
            web_url="https://${WEB_CANONICAL_HOST}"
            api_url="https://${api_fqdn}"
            curl --fail --retry 12 --retry-delay 10 \
              --header "origin: ${web_url}" \
              --dump-header api-precondition-headers.txt \
              "${api_url}/ready"
            tr -d '\r' < api-precondition-headers.txt \
              | grep -iFx "access-control-allow-origin: ${web_url}"
          elif [ "$DEPLOYMENT_SCOPE" != "full" ]; then
            echo "The public-web deployment requires an existing API with canonical CORS." >&2
            exit 1
          fi
          web_url="https://${WEB_CANONICAL_HOST}"

          static_ip=$(az containerapp env show \
            --name "$APP_ENVIRONMENT" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.staticIp -o tsv)
          verification_id=$(az containerapp env show \
            --name "$APP_ENVIRONMENT" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.customDomainConfiguration.customDomainVerificationId -o tsv)
          web_app=$(az containerapp list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name == 'ca-keyforta-${ENVIRONMENT}-web'].name | [0]" -o tsv)
          if [ -n "$web_app" ]; then
            web_fqdn=$(az containerapp show \
              --name "$web_app" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            if [ -z "$web_fqdn" ]; then
              echo "The existing web Container App has no ingress FQDN." >&2
              exit 1
            fi
          else
            default_domain=$(az containerapp env show \
              --name "$APP_ENVIRONMENT" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.defaultDomain -o tsv)
            web_fqdn="ca-keyforta-${ENVIRONMENT}-web.${default_domain}"
          fi
          test "$(dig +short A "$WEB_CANONICAL_HOST")" = "$static_ip"
          test "$(dig +short CNAME "$WEB_WWW_HOST" | sed 's/\.$//')" = "$web_fqdn"
          for verification_host in "asuid.${WEB_CANONICAL_HOST}" "asuid.${WEB_WWW_HOST}"; do
            test "$(dig +short TXT "$verification_host" | tr -d '\"')" = "$verification_id"
          done

      - name: Verify subdomain domain preconditions
        if: inputs.operation == 'deploy' && (env.DEPLOYMENT_SCOPE == 'api' || env.DEPLOYMENT_SCOPE == 'admin-web' || env.DEPLOYMENT_SCOPE == 'portal-web' || env.DEPLOYMENT_SCOPE == 'full')
        run: |
          verification_id=$(az containerapp env show \
            --name "$APP_ENVIRONMENT" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.customDomainConfiguration.customDomainVerificationId -o tsv)
          default_domain=$(az containerapp env show \
            --name "$APP_ENVIRONMENT" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.defaultDomain -o tsv)

          verify_subdomain() {
            app_suffix="$1"
            canonical_host="$2"
            app=$(az containerapp list \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?name == 'ca-keyforta-${ENVIRONMENT}-${app_suffix}'].name | [0]" -o tsv)
            if [ -n "$app" ]; then
              fqdn=$(az containerapp show \
                --name "$app" \
                --resource-group "$RESOURCE_GROUP" \
                --query properties.configuration.ingress.fqdn -o tsv)
              if [ -z "$fqdn" ]; then
                echo "The existing ${app_suffix} Container App has no ingress FQDN." >&2
                exit 1
              fi
            else
              fqdn="ca-keyforta-${ENVIRONMENT}-${app_suffix}.${default_domain}"
            fi
            test "$(dig +short CNAME "$canonical_host" | sed 's/\.$//')" = "$fqdn"
            test "$(dig +short TXT "asuid.${canonical_host}" | tr -d '\"')" = "$verification_id"
          }
          if [ "$DEPLOYMENT_SCOPE" = "api" ] || [ "$DEPLOYMENT_SCOPE" = "full" ]; then
            verify_subdomain api "$API_CANONICAL_HOST"
          fi
          if [ "$DEPLOYMENT_SCOPE" = "admin-web" ] || [ "$DEPLOYMENT_SCOPE" = "full" ]; then
            verify_subdomain admin "$ADMIN_CANONICAL_HOST"
          fi
          if [ "$DEPLOYMENT_SCOPE" = "portal-web" ] || [ "$DEPLOYMENT_SCOPE" = "full" ]; then
            verify_subdomain portal "$PORTAL_CANONICAL_HOST"
          fi

      - name: Verify PostgreSQL DBA access configuration
        if: (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres') && (inputs.operation == 'deploy' || (inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true'))
        run: |
          if [ -z "$DBA_CLIENT_IP" ] && [ -z "$DBA_OBJECT_ID" ] && [ -z "$DBA_PRINCIPAL_NAME" ]; then
            exit 0
          fi
          test -n "$DBA_CLIENT_IP"
          test -n "$DBA_OBJECT_ID"
          test -n "$DBA_PRINCIPAL_NAME"
          case "$DBA_PRINCIPAL_TYPE" in
            User|Group) ;;
            *) echo "POSTGRES_DBA_PRINCIPAL_TYPE must be User or Group" >&2; exit 1 ;;
          esac

      - name: Verify admin API dependency
        if: inputs.operation == 'deploy' && env.DEPLOYMENT_SCOPE == 'admin-web'
        run: |
          api_fqdn=$(az containerapp show \
            --name "ca-keyforta-${ENVIRONMENT}-api" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$api_fqdn"
          curl --fail --silent --show-error \
            --header "origin: ${ADMIN_PUBLIC_BASE_URL}" \
            --dump-header admin-api-preflight-headers.txt \
            --output /dev/null \
            "https://${api_fqdn}/health"
          tr -d '\r' < admin-api-preflight-headers.txt \
            | grep -iFx "access-control-allow-origin: ${ADMIN_PUBLIC_BASE_URL}" \
            || { echo "Deploy the API or use full scope before admin-web." >&2; exit 1; }

      - name: Verify portal API dependency
        if: inputs.operation == 'deploy' && env.DEPLOYMENT_SCOPE == 'portal-web'
        run: |
          api_fqdn=$(az containerapp show \
            --name "ca-keyforta-${ENVIRONMENT}-api" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          test -n "$api_fqdn"
          curl --fail --silent --show-error \
            --header "origin: ${PORTAL_PUBLIC_BASE_URL}" \
            --dump-header portal-api-preflight-headers.txt \
            --output /dev/null \
            "https://${api_fqdn}/health"
          tr -d '\r' < portal-api-preflight-headers.txt \
            | grep -iFx "access-control-allow-origin: ${PORTAL_PUBLIC_BASE_URL}" \
            || { echo "Deploy the API or use full scope before portal-web." >&2; exit 1; }

      - name: Set up Docker Buildx
        if: inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver: docker-container

      - name: Build and push immutable images
        if: inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true'
        run: |
          az acr login --name "$REGISTRY_NAME"

          reject_existing_tag() {
            repository="$1"
            show_tags_stderr_file=$(mktemp)
            if ! show_tags_output=$(az acr repository show-tags \
              --name "$REGISTRY_NAME" \
              --repository "$repository" \
              --query "[?@=='$DEPLOYMENT_SHA'] | [0]" -o tsv 2>"$show_tags_stderr_file"); then
              show_tags_error=$(cat "$show_tags_stderr_file")
              rm -f "$show_tags_stderr_file"
              if echo "$show_tags_error" | grep -q "repository \"$repository\" is not found"; then
                # First-ever push for this repository: nothing to conflict with.
                return 0
              fi
              echo "$show_tags_error" >&2
              exit 1
            fi
            rm -f "$show_tags_stderr_file"
            if [ -n "$show_tags_output" ]; then
              echo "Immutable image tag $repository:$DEPLOYMENT_SHA already exists; use its original reviewed plan." >&2
              exit 1
            fi
          }
          if [ "$DEPLOYMENT_SCOPE" = "api" ] || [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "postgres" ]; then
            reject_existing_tag keyforta-api
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "public-web" ]; then
            reject_existing_tag keyforta-public-web
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "admin-web" ]; then
            reject_existing_tag keyforta-admin-web
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "portal-web" ]; then
            reject_existing_tag keyforta-portal-web
          fi

          api_status=0
          web_status=0
          admin_status=0
          portal_status=0
          api_pid=""
          web_pid=""
          admin_pid=""
          portal_pid=""
          if [ "$DEPLOYMENT_SCOPE" = "api" ] || [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "postgres" ]; then
            docker buildx build \
              --file deployments/azure/docker/api.Dockerfile \
              --label "org.opencontainers.image.revision=$DEPLOYMENT_SHA" \
              --provenance=mode=max \
              --sbom=true \
              --push \
              --tag "$REGISTRY_SERVER/keyforta-api:$DEPLOYMENT_SHA" . &
            api_pid=$!
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "public-web" ]; then
            docker buildx build \
              --build-arg NEXT_PUBLIC_ENTRA_API_SCOPE="${{ vars.ENTRA_API_SCOPE }}" \
              --build-arg NEXT_PUBLIC_ENTRA_AUTHORITY="${{ vars.ENTRA_AUTHORITY }}" \
              --build-arg NEXT_PUBLIC_ENTRA_CLIENT_ID="${{ vars.PUBLIC_ENTRA_CLIENT_ID }}" \
              --file deployments/azure/docker/public-web.Dockerfile \
              --label "org.opencontainers.image.revision=$DEPLOYMENT_SHA" \
              --provenance=mode=max \
              --sbom=true \
              --push \
              --tag "$REGISTRY_SERVER/keyforta-public-web:$DEPLOYMENT_SHA" . &
            web_pid=$!
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "admin-web" ]; then
            docker buildx build \
              --build-arg VITE_ENTRA_API_SCOPE="${{ vars.ENTRA_API_SCOPE }}" \
              --build-arg VITE_ENTRA_AUTHORITY="${{ vars.ENTRA_AUTHORITY }}" \
              --build-arg VITE_ENTRA_CLIENT_ID="${{ vars.ADMIN_ENTRA_CLIENT_ID }}" \
              --build-arg VITE_KEYFORTA_API_BASE_URL="$API_PUBLIC_BASE_URL" \
              --file deployments/azure/docker/admin-web.Dockerfile \
              --label "org.opencontainers.image.revision=$DEPLOYMENT_SHA" \
              --provenance=mode=max \
              --sbom=true \
              --push \
              --tag "$REGISTRY_SERVER/keyforta-admin-web:$DEPLOYMENT_SHA" . &
            admin_pid=$!
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "portal-web" ]; then
            docker buildx build \
              --build-arg VITE_ENTRA_API_SCOPE="${{ vars.ENTRA_API_SCOPE }}" \
              --build-arg VITE_ENTRA_AUTHORITY="${{ vars.ENTRA_AUTHORITY }}" \
              --build-arg VITE_ENTRA_CLIENT_ID="${{ vars.PORTAL_ENTRA_CLIENT_ID }}" \
              --build-arg VITE_KEYFORTA_API_BASE_URL="$API_PUBLIC_BASE_URL" \
              --file deployments/azure/docker/portal-web.Dockerfile \
              --label "org.opencontainers.image.revision=$DEPLOYMENT_SHA" \
              --provenance=mode=max \
              --sbom=true \
              --push \
              --tag "$REGISTRY_SERVER/keyforta-portal-web:$DEPLOYMENT_SHA" . &
            portal_pid=$!
          fi

          if [ -n "$api_pid" ]; then wait "$api_pid" || api_status=$?; fi
          if [ -n "$web_pid" ]; then wait "$web_pid" || web_status=$?; fi
          if [ -n "$admin_pid" ]; then wait "$admin_pid" || admin_status=$?; fi
          if [ -n "$portal_pid" ]; then wait "$portal_pid" || portal_status=$?; fi

          if [ "$api_status" -ne 0 ]; then
            echo "::error title=API container build failed::docker build exited with status $api_status"
          fi
          if [ "$web_status" -ne 0 ]; then
            echo "::error title=Web container build failed::docker build exited with status $web_status"
          fi
          if [ "$admin_status" -ne 0 ]; then
            echo "::error title=Admin container build failed::docker build exited with status $admin_status"
          fi
          if [ "$portal_status" -ne 0 ]; then
            echo "::error title=Portal container build failed::docker build exited with status $portal_status"
          fi
          test "$api_status" -eq 0
          test "$web_status" -eq 0
          test "$admin_status" -eq 0
          test "$portal_status" -eq 0

          resolve_digest() {
            repository="$1"
            attempt=1
            max_attempts=5
            last_error=""
            while [ "$attempt" -le "$max_attempts" ]; do
              digest_stderr_file=$(mktemp)
              if digest=$(az acr repository show --name "$REGISTRY_NAME" --image "$repository:$DEPLOYMENT_SHA" --query digest -o tsv 2>"$digest_stderr_file"); then
                rm -f "$digest_stderr_file"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "$digest"
                  return 0
                fi
                last_error="Unexpected digest output: $digest"
              else
                last_error=$(cat "$digest_stderr_file")
                rm -f "$digest_stderr_file"
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                # A repository's first-ever push can briefly lag ACR's read path;
                # retry before treating this as a real failure.
                sleep "${ACR_RETRY_DELAY_SECONDS:-5}"
              fi
              attempt=$((attempt + 1))
            done
            echo "Could not resolve digest for $repository:$DEPLOYMENT_SHA after $max_attempts attempts: $last_error" >&2
            exit 1
          }
          if [ "$DEPLOYMENT_SCOPE" = "api" ] || [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "postgres" ]; then
            api_digest=$(resolve_digest keyforta-api); [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "API_IMAGE=$REGISTRY_SERVER/keyforta-api@$api_digest" >> "$GITHUB_ENV"
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "public-web" ]; then
            web_digest=$(resolve_digest keyforta-public-web); [[ "$web_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "WEB_IMAGE=$REGISTRY_SERVER/keyforta-public-web@$web_digest" >> "$GITHUB_ENV"
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "admin-web" ]; then
            admin_digest=$(resolve_digest keyforta-admin-web); [[ "$admin_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "ADMIN_IMAGE=$REGISTRY_SERVER/keyforta-admin-web@$admin_digest" >> "$GITHUB_ENV"
          fi
          if [ "$DEPLOYMENT_SCOPE" = "full" ] || [ "$DEPLOYMENT_SCOPE" = "portal-web" ]; then
            portal_digest=$(resolve_digest keyforta-portal-web); [[ "$portal_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "PORTAL_IMAGE=$REGISTRY_SERVER/keyforta-portal-web@$portal_digest" >> "$GITHUB_ENV"
          fi

          lock_image() {
            image="$1:$DEPLOYMENT_SHA"
            az acr repository update --name "$REGISTRY_NAME" --image "$image" --write-enabled false >/dev/null
            attempt=1
            # This previously queried the bare "writeEnabled" JMESPath field,
            # which does not exist at the top level of `az acr repository
            # show`'s output (it lives under `changeableAttributes`); that
            # always resolved to an empty string and could never converge,
            # regardless of retry budget -- the real cause of two full-scope
            # deploy failures (runs 36208850858, 36210171924). The retry
            # budget below is kept as a safety margin for genuine ACR
            # read-after-write lag (observed up to ~71s in the wild), not as
            # the primary fix.
            max_attempts=20
            last_error=""
            while [ "$attempt" -le "$max_attempts" ]; do
              lock_stderr_file=$(mktemp)
              if last_write_enabled=$(az acr repository show --name "$REGISTRY_NAME" --image "$image" --query changeableAttributes.writeEnabled -o tsv 2>"$lock_stderr_file"); then
                rm -f "$lock_stderr_file"
                if [ "$last_write_enabled" = "false" ]; then
                  return 0
                fi
                last_error="Observed writeEnabled=$last_write_enabled"
              else
                last_error=$(cat "$lock_stderr_file")
                rm -f "$lock_stderr_file"
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                # ACR can briefly report the pre-update writeEnabled value,
                # or the read itself can transiently fail, right after the
                # update call; retry before failing.
                sleep "${ACR_RETRY_DELAY_SECONDS:-5}"
              fi
              attempt=$((attempt + 1))
            done
            echo "Could not confirm $image is locked (immutable) after $max_attempts attempts: $last_error" >&2
            exit 1
          }
          if [ -n "$api_pid" ]; then lock_image keyforta-api; fi
          if [ -n "$web_pid" ]; then lock_image keyforta-public-web; fi
          if [ -n "$admin_pid" ]; then lock_image keyforta-admin-web; fi
          if [ -n "$portal_pid" ]; then lock_image keyforta-portal-web; fi

      - name: Verify application image attestations
        if: inputs.operation == 'plan' && steps.foundation-state.outputs.exists == 'true'
        run: |
          verify_attestations() {
            name="$1"
            image="$2"
            test -n "$image"
            docker buildx imagetools inspect "$image" --format '{{json .SBOM}}' > "${name}-sbom.json"
            docker buildx imagetools inspect "$image" --format '{{json .Provenance}}' > "${name}-provenance.json"
            jq --exit-status 'type == "object" and length > 0' "${name}-sbom.json" >/dev/null
            jq --exit-status 'type == "object" and length > 0' "${name}-provenance.json" >/dev/null
          }
          if [ -n "$API_IMAGE" ]; then verify_attestations api "$API_IMAGE"; fi
          if [ -n "$WEB_IMAGE" ]; then verify_attestations web "$WEB_IMAGE"; fi
          if [ -n "$ADMIN_IMAGE" ]; then verify_attestations admin "$ADMIN_IMAGE"; fi
          if [ -n "$PORTAL_IMAGE" ]; then verify_attestations portal "$PORTAL_IMAGE"; fi

      - name: Scan immutable API image
        if: inputs.operation == 'plan' && env.API_IMAGE != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.API_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan immutable public web image
        if: inputs.operation == 'plan' && env.WEB_IMAGE != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan immutable admin web image
        if: inputs.operation == 'plan' && env.ADMIN_IMAGE != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ADMIN_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan immutable portal web image
        if: inputs.operation == 'plan' && env.PORTAL_IMAGE != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.PORTAL_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Preview database and job changes
        if: inputs.operation != 'deploy-foundation' && steps.foundation-state.outputs.exists == 'true' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        run: |
          prefix=""
          if [ "${{ inputs.operation }}" = "deploy" ]; then prefix="current-"; fi
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "keyforta-${ENVIRONMENT}-database-access" \
            --template-file infra/bicep/database-access.bicep \
            --parameters postgresServerName="$POSTGRES_SERVER" \
              azureTenantId="${{ vars.AZURE_TENANT_ID }}" \
              administratorObjectId="$MIGRATION_PRINCIPAL_ID" \
              administratorPrincipalName="$MIGRATION_IDENTITY" \
              dbaObjectId="$DBA_OBJECT_ID" \
              dbaPrincipalName="$DBA_PRINCIPAL_NAME" \
              dbaPrincipalType="$DBA_PRINCIPAL_TYPE" \
              dbaClientIpAddress="$DBA_CLIENT_IP" \
            --no-pretty-print --result-format FullResourcePayloads --output json \
            > "${prefix}database-access-what-if.json"
          az deployment group what-if \
            --resource-group "$RESOURCE_GROUP" \
            --name "keyforta-${ENVIRONMENT}-migration-job" \
            --template-file infra/bicep/migration-job.bicep \
            --parameters environment="$ENVIRONMENT" \
              containerAppsEnvironmentName="$APP_ENVIRONMENT" \
              registryName="$REGISTRY_NAME" \
              migrationIdentityName="$MIGRATION_IDENTITY" \
              apiIdentityName="$API_IDENTITY" \
              postgresServerName="$POSTGRES_SERVER" \
              apiImage="$API_IMAGE" \
            --no-pretty-print --result-format FullResourcePayloads --output json \
            > "${prefix}migration-job-what-if.json"
          if [ "$DEPLOYMENT_SCOPE" = "full" ]; then
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-seed-job" \
              --template-file infra/bicep/seed-job.bicep \
              --parameters environment="$ENVIRONMENT" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                migrationIdentityName="$MIGRATION_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$API_IMAGE" \
              --no-pretty-print --result-format FullResourcePayloads --output json \
              > "${prefix}seed-job-what-if.json"
          fi

      - name: Verify reviewed database and job plans still apply
        if: inputs.operation == 'deploy' && (env.DEPLOYMENT_SCOPE == 'full' || env.DEPLOYMENT_SCOPE == 'postgres')
        run: |
          compare_plan() {
            name="$1"
            jq -S '.changes | sort_by(.resourceId)' "plan-evidence/${name}-what-if.json" > "reviewed-${name}-what-if.json"
            jq -S '.changes | sort_by(.resourceId)' "current-${name}-what-if.json" > "current-normalized-${name}-what-if.json"
            if ! diff -u "reviewed-${name}-what-if.json" "current-normalized-${name}-what-if.json"; then
              echo "$name resources drifted from the reviewed plan; run a new plan." >&2
              exit 1
            fi
          }
          compare_plan database-access
          compare_plan migration-job
          if [ "$DEPLOYMENT_SCOPE" = "full" ]; then compare_plan seed-job; fi

      # The four hostname-bootstrap steps below always pin deploymentScope to
      # their own single service, even during a `full` deploy: apps.bicep
      # derives deployWeb/deployApi/deployAdmin/deployPortal from
      # deploymentScope, so a single-service scope guarantees each bootstrap
      # only evaluates its own resources. Using the overall $DEPLOYMENT_SCOPE
      # here would let a `full` bootstrap deployment also apply another
      # service's certificate binding in the same call, which would race with
      # (and invalidate) that other service's independently-reviewed what-if
      # plan when more than one service needs bootstrapping at once.
      - name: Preview web hostname bootstrap
        if: (env.DEPLOYMENT_SCOPE == 'public-web' || env.DEPLOYMENT_SCOPE == 'full') && steps.hostname-state.outputs.bootstrap-required == 'true'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            output_file=hostname-bootstrap-web-what-if.json
            if [ "${{ inputs.operation }}" = "deploy" ]; then
              output_file=current-hostname-bootstrap-web-what-if.json
            fi
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-apps-hostname-bootstrap" \
              --template-file infra/bicep/apps.bicep \
              --parameters environment="$ENVIRONMENT" \
                deploymentScope="public-web" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                apiIdentityName="$API_IDENTITY" \
                webIdentityName="$WEB_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$API_IMAGE" \
                webImage="$WEB_IMAGE" \
                adminImage="$ADMIN_IMAGE" \
                portalImage="$PORTAL_IMAGE" \
                databaseUserName="$API_IDENTITY" \
                entraAudience="${{ vars.ENTRA_AUDIENCE }}" \
                entraIssuer="${{ vars.ENTRA_ISSUER }}" \
                entraJwksUri="${{ vars.ENTRA_JWKS_URI }}" \
                platformAdminObjectIds="$PLATFORM_ADMIN_OBJECT_IDS" \
                authorizationModuleEnabled="$AUTHORIZATION_MODULE_ENABLED" \
                documentStorageAccountName="$DOCUMENT_STORAGE_ACCOUNT" \
                tenantApplicationContainerName="$TENANT_APPLICATION_CONTAINER" \
                webCanonicalHostName="$WEB_CANONICAL_HOST" \
                webWwwHostName="$WEB_WWW_HOST" \
                apiCanonicalHostName="$API_CANONICAL_HOST" \
                adminCanonicalHostName="$ADMIN_CANONICAL_HOST" \
                portalCanonicalHostName="$PORTAL_CANONICAL_HOST" \
                bindWebCertificates=false \
                bindApiCertificates=true \
                bindAdminCertificates=true \
                bindPortalCertificates=true \
              --no-pretty-print --result-format FullResourcePayloads --output json \
              > "$output_file"

      - name: Preview api hostname bootstrap
        if: (env.DEPLOYMENT_SCOPE == 'api' || env.DEPLOYMENT_SCOPE == 'full') && steps.hostname-state.outputs.api-bootstrap-required == 'true'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            output_file=hostname-bootstrap-api-what-if.json
            if [ "${{ inputs.operation }}" = "deploy" ]; then
              output_file=current-hostname-bootstrap-api-what-if.json
            fi
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-apps-api-hostname-bootstrap" \
              --template-file infra/bicep/apps.bicep \
              --parameters environment="$ENVIRONMENT" \
                deploymentScope="api" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                apiIdentityName="$API_IDENTITY" \
                webIdentityName="$WEB_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$API_IMAGE" \
                webImage="$WEB_IMAGE" \
                adminImage="$ADMIN_IMAGE" \
                portalImage="$PORTAL_IMAGE" \
                databaseUserName="$API_IDENTITY" \
                entraAudience="${{ vars.ENTRA_AUDIENCE }}" \
                entraIssuer="${{ vars.ENTRA_ISSUER }}" \
                entraJwksUri="${{ vars.ENTRA_JWKS_URI }}" \
                platformAdminObjectIds="$PLATFORM_ADMIN_OBJECT_IDS" \
                authorizationModuleEnabled="$AUTHORIZATION_MODULE_ENABLED" \
                documentStorageAccountName="$DOCUMENT_STORAGE_ACCOUNT" \
                tenantApplicationContainerName="$TENANT_APPLICATION_CONTAINER" \
                webCanonicalHostName="$WEB_CANONICAL_HOST" \
                webWwwHostName="$WEB_WWW_HOST" \
                apiCanonicalHostName="$API_CANONICAL_HOST" \
                adminCanonicalHostName="$ADMIN_CANONICAL_HOST" \
                portalCanonicalHostName="$PORTAL_CANONICAL_HOST" \
                bindWebCertificates=true \
                bindApiCertificates=false \
                bindAdminCertificates=true \
                bindPortalCertificates=true \
              --no-pretty-print --result-format FullResourcePayloads --output json \
              > "$output_file"

      - name: Preview admin-web hostname bootstrap
        if: (env.DEPLOYMENT_SCOPE == 'admin-web' || env.DEPLOYMENT_SCOPE == 'full') && steps.hostname-state.outputs.admin-bootstrap-required == 'true'
        uses: azure/CLI@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            output_file=hostname-bootstrap-admin-what-if.json
            if [ "${{ inputs.operation }}" = "deploy" ]; then
              output_file=current-hostname-bootstrap-admin-what-if.json
            fi
            az deployment group what-if \
              --resource-group "$RESOURCE_GROUP" \
              --name "keyforta-${ENVIRONMENT}-apps-admin-hostname-bootstrap" \
              --template-file infra/bicep/apps.bicep \
              --parameters environment="$ENVIRONMENT" \
                deploymentScope="admin-web" \
                containerAppsEnvironmentName="$APP_ENVIRONMENT" \
                registryName="$REGISTRY_NAME" \
                apiIdentityName="$API_IDENTITY" \
                webIdentityName="$WEB_IDENTITY" \
                postgresServerName="$POSTGRES_SERVER" \
                apiImage="$API_IMAGE" \
                webImage="$WEB_IMAGE" \
                adminImage="$ADMIN_IMAGE" \
                portalImage="$PORTAL_IMAGE" \
                databaseUserName="$API_IDENTITY" \
                entraAudience="${{ vars.ENTRA_AUDIENCE }}" \
                entraIssuer="${{ vars.ENTRA_ISSUER }}" \
                entraJwksUri="${{ vars.ENTRA_JWKS_URI }}" \
                platformAdminObjectIds="$PLATFORM_ADMIN_OBJECT_IDS" \
                authorizationModuleEnabled="$AUTHORIZATION_MODULE_ENABLED" \
                documentStorageAccountName="$DOCUMENT_STORAGE_ACCOUNT" \
                tenantApplicationContainerName="$TENANT_APPLICATION_CONTAINER" \
                webCanonicalHostName="$WEB_CANONICAL_HOST" \
                webWwwHostName="$WEB_WWW_HOST" \
                apiCanonicalHostName="$API_CANONICAL_HOST" \
                adminCanonicalHostName="$ADMIN_CANONICAL_HOST" \
                portalCanonicalHostName="$PORTAL_CANONICAL_HOST" \
                bindWebCertificates=true \
                bindApiCertificates=true \
                bindAdminCertificates=false \
                bindPortalCertificates=true \
              --no-pretty-print --result-format FullResourcePayloads --output json \
              > "$output_file"

      - name: Preview portal-web hostname bootstrap
        if: (env.DEPLOYMENT_SCOPE == 'portal-web' || env.DEPLOYMENT_SCOPE == 'full') && steps.hostname-state.outputs.portal-bootstrap-required == 'true'
