                .changes[]
                | {
                    resourceId: (.resourceId | ascii_downcase),
                    changeType,
                    before,
                    after,
                    delta
                  }
              ] | sort_by(.resourceId)
            }' "$1"
          }
          normalize_what_if plan-evidence/application-what-if.json > reviewed-application-what-if.json
          normalize_what_if current-application-what-if.json > current-normalized-application-what-if.json
          if ! diff -u reviewed-application-what-if.json current-normalized-application-what-if.json; then
            echo "Application resources drifted from the reviewed plan; run a new plan." >&2
            exit 1
          fi

