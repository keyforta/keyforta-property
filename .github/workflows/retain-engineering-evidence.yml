name: Retain engineering evidence

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: retain-evidence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retain:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted retention control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download untrusted engineering evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEYFORTA_ARTIFACT_NAME: untrusted-engineering-evidence-${{ github.event.workflow_run.head_sha }}
          KEYFORTA_ARTIFACT_RUN_ID: ${{ github.event.workflow_run.id }}
          KEYFORTA_ARTIFACT_DESTINATION: ${{ runner.temp }}/keyforta-report-candidate.tar
        run: python3 harness/scripts/download-report-candidate.py

      - name: Scan and snapshot candidate evidence
        env:
          KEYFORTA_REPORT_SOURCE: ${{ runner.temp }}/keyforta-report-source/reports
          KEYFORTA_REPORT_SNAPSHOT: ${{ runner.temp }}/keyforta-evidence
        run: |
          python3 harness/scripts/extract-report-candidate.py \
            "$RUNNER_TEMP/keyforta-report-candidate.tar" \
            "$RUNNER_TEMP/keyforta-report-source"
          node harness/scripts/verify-reports.mjs

      - name: Retain sanitized engineering evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: engineering-evidence-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/keyforta-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Remove evidence directories
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/keyforta-report-candidate.tar" "$RUNNER_TEMP/keyforta-report-source" "$RUNNER_TEMP/keyforta-evidence"