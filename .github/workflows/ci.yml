name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HARNESS_CONTRACT_MODE: ${{ github.event_name == 'pull_request' && 'required' || 'skip' }}
      HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      HARNESS_TASK_CONTRACT: "${{ github.event.pull_request.number == 13 && 'harness/tasks/HAR-009.json' || '' }}"
      VALIDATION_USER: keyforta-ci
      VALIDATION_HOME: /home/keyforta-ci
      VALIDATION_WORKSPACE: /tmp/keyforta-workspace-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          dest: /tmp/keyforta-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Seal pnpm installation
        run: chmod -R u+rwX,go+rX,go-w -- "${{ steps.pnpm.outputs.dest }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Create unprivileged validation user
        run: |
          sudo useradd --create-home --shell /bin/bash "$VALIDATION_USER"
          sudo rm -rf -- "$VALIDATION_WORKSPACE"
          sudo mkdir -p -- "$VALIDATION_WORKSPACE"
          sudo cp -a -- "$GITHUB_WORKSPACE/." "$VALIDATION_WORKSPACE/"
          sudo chown -R "$VALIDATION_USER:$VALIDATION_USER" "$VALIDATION_WORKSPACE"

      - name: Install dependencies
        working-directory: ${{ env.VALIDATION_WORKSPACE }}
        run: sudo --preserve-env=CI,HARNESS_CONTRACT_MODE,HARNESS_BASE_REF,HARNESS_TASK_CONTRACT,GITHUB_HEAD_REF,GITHUB_REF_NAME -u "$VALIDATION_USER" env HOME="$VALIDATION_HOME" XDG_CONFIG_HOME="$VALIDATION_HOME/.config" XDG_CACHE_HOME="$VALIDATION_HOME/.cache" XDG_DATA_HOME="$VALIDATION_HOME/.local/share" XDG_STATE_HOME="$VALIDATION_HOME/.local/state" PATH="$PATH" pnpm install --frozen-lockfile

      - name: Validate repository
        working-directory: ${{ env.VALIDATION_WORKSPACE }}
        run: sudo --preserve-env=CI,HARNESS_CONTRACT_MODE,HARNESS_BASE_REF,HARNESS_TASK_CONTRACT,GITHUB_HEAD_REF,GITHUB_REF_NAME -u "$VALIDATION_USER" env HOME="$VALIDATION_HOME" XDG_CONFIG_HOME="$VALIDATION_HOME/.config" XDG_CACHE_HOME="$VALIDATION_HOME/.cache" XDG_DATA_HOME="$VALIDATION_HOME/.local/share" XDG_STATE_HOME="$VALIDATION_HOME/.local/state" PATH="$PATH" node harness/scripts/verify.mjs

      - name: Generate final commit evidence
        if: success() && github.event_name == 'pull_request'
        working-directory: ${{ env.VALIDATION_WORKSPACE }}
        run: |
          sudo --preserve-env=CI,HARNESS_CONTRACT_MODE,HARNESS_BASE_REF,HARNESS_TASK_CONTRACT,GITHUB_HEAD_REF,GITHUB_REF_NAME -u "$VALIDATION_USER" env HOME="$VALIDATION_HOME" XDG_CONFIG_HOME="$VALIDATION_HOME/.config" XDG_CACHE_HOME="$VALIDATION_HOME/.cache" XDG_DATA_HOME="$VALIDATION_HOME/.local/share" XDG_STATE_HOME="$VALIDATION_HOME/.local/state" PATH="$PATH" node harness/scripts/generate-evidence.mjs
          sudo --preserve-env=CI,HARNESS_CONTRACT_MODE,HARNESS_BASE_REF,HARNESS_TASK_CONTRACT,GITHUB_HEAD_REF,GITHUB_REF_NAME -u "$VALIDATION_USER" env HOME="$VALIDATION_HOME" XDG_CONFIG_HOME="$VALIDATION_HOME/.config" XDG_CACHE_HOME="$VALIDATION_HOME/.cache" XDG_DATA_HOME="$VALIDATION_HOME/.local/share" XDG_STATE_HOME="$VALIDATION_HOME/.local/state" PATH="$PATH" pnpm verify:evidence
          sudo --preserve-env=CI,HARNESS_CONTRACT_MODE,HARNESS_BASE_REF,HARNESS_TASK_CONTRACT,GITHUB_HEAD_REF,GITHUB_REF_NAME -u "$VALIDATION_USER" env HOME="$VALIDATION_HOME" XDG_CONFIG_HOME="$VALIDATION_HOME/.config" XDG_CACHE_HOME="$VALIDATION_HOME/.cache" XDG_DATA_HOME="$VALIDATION_HOME/.local/share" XDG_STATE_HOME="$VALIDATION_HOME/.local/state" PATH="$PATH" EDD_VALIDATE_CURRENT_STATE=true EDD_SATISFIED_CHECKS=dependency-audit,verify:evidence pnpm verify:transition

      - name: Stop validation producer
        if: always()
        run: |
          sudo usermod --lock --expiredate 1 "$VALIDATION_USER" || true
          sudo pkill -KILL -u "$VALIDATION_USER" || true

      - name: Package untrusted engineering evidence
        if: always() && github.event_name == 'pull_request'
        run: sudo tar --create --file "$RUNNER_TEMP/keyforta-report-candidate.tar" --directory "$VALIDATION_WORKSPACE/harness" reports

      - name: Upload untrusted engineering evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: untrusted-engineering-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/keyforta-report-candidate.tar
          if-no-files-found: error
          retention-days: 1

      - name: Remove validation workspace
        if: always()
        run: sudo rm -rf -- "$RUNNER_TEMP/keyforta-report-candidate.tar" "$VALIDATION_WORKSPACE"
