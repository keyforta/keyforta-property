name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HARNESS_CONTRACT_MODE: ${{ github.event_name == 'pull_request' && 'required' || 'skip' }}
      HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      HARNESS_TASK_CONTRACT: ${{ github.event.pull_request.number == 19 && 'harness/tasks/HAR-008.json' || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: node harness/scripts/verify.mjs

      - name: Generate final commit evidence
        if: success() && github.event_name == 'pull_request'
        run: |
          node harness/scripts/generate-evidence.mjs
          pnpm verify:evidence
          EDD_VALIDATE_CURRENT_STATE=true EDD_SATISFIED_CHECKS=verify:evidence pnpm verify:transition

      - name: Upload untrusted engineering evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: untrusted-engineering-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: harness/reports/
          if-no-files-found: error
          retention-days: 1
