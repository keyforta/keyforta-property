name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commit range for secrets
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject historical migration rewrites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi
          changes=$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- infra/postgres/migrations)
          if [[ -z "$changes" ]]; then
            exit 0
          fi

          # Ordinary case: every changed line is a pure addition (new
          # forward-only migration files). Always allowed -- except for
          # the canonical baseline filename itself, which must always go
          # through the full squash validation below even when it's the
          # only changed line (a pure "add 0001_baseline.sql" commit with
          # zero deletions would otherwise slip through this fast path
          # while every historical file remains in place; the runtime
          # boundary in apps/api/src/migrate.ts would then silently stop
          # applying all of them, since 0001_baseline.sql sorts before
          # every 000N_*.sql file that isn't itself named "baseline").
          canonical_baseline="infra/postgres/migrations/0001_baseline.sql"
          if ! grep -qF "	$canonical_baseline" <<< "$changes" \
            && ! awk 'NF && $1 !~ /^A/ { found=1 } END { exit found ? 0 : 1 }' <<< "$changes"; then
            exit 0
          fi

          # One-time, fully auditable pre-launch consolidation exception
          # (see ADR-013's 2026-09-27 amendment): before any environment
          # holds production tenant data, the entire lineage may be
          # replaced with a single new baseline file in one commit. This
          # is narrowly scoped so it can never permit rewriting or
          # renaming a single existing file, can never permit a partial
          # squash that leaves some historical files behind, and can
          # never fire more than once (which would violate ADR-013's
          # explicit "not a precedent" language): every changed line must
          # be a pure delete or a pure add (no modifies/renames), exactly
          # one file may be added and it must be exactly
          # "infra/postgres/migrations/0001_baseline.sql" -- the literal
          # name apps/api/src/migrate.ts hardcodes as its runtime
          # boundary, not any "*_baseline.sql" match a runner would
          # silently ignore -- at least two files must be deleted (a
          # genuine full-lineage consolidation, not a 1-for-1
          # replacement), the migrations directory at HEAD must contain
          # that one added file and nothing else, and no file by that
          # exact name may already have existed at BASE_SHA (so this
          # exception can only ever satisfy the very first squash, never
          # a later one replacing an already-established baseline).
          modified=$(awk '$1 !~ /^A/ && $1 !~ /^D/' <<< "$changes")
          added=$(awk '$1 ~ /^A/ { print $2 }' <<< "$changes")
          added_count=$(grep -c . <<< "$added" || true)
          deleted_count=$(awk '$1 ~ /^D/' <<< "$changes" | grep -c . || true)
          remaining=$(git ls-tree -r --name-only "$HEAD_SHA" -- infra/postgres/migrations)
          remaining_count=$(grep -c . <<< "$remaining" || true)
          preexisting_baseline=$(git ls-tree -r --name-only "$BASE_SHA" -- "$canonical_baseline")
          if [[ -z "$modified" ]] \
            && [[ "$added_count" -eq 1 ]] \
            && [[ "$deleted_count" -ge 2 ]] \
            && [[ "$remaining_count" -eq 1 ]] \
            && [[ -z "$preexisting_baseline" ]] \
            && [[ "$added" == "$canonical_baseline" ]]; then
            echo "One-time pre-launch migration consolidation detected (ADR-013 amendment):" >&2
            echo "$changes" >&2
            exit 0
          fi

          echo "Existing migrations are immutable; add a forward migration instead." >&2
          echo "$changes" >&2
          exit 1

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/default

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: .git

      - name: Compile MCP template for fallback scan
        run: az bicep build --file infra/bicep/mcp.bicep --outfile mcp.arm.json

      - name: Scan Bicep security configuration
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            bridgecrew/checkov:3.3.17@sha256:41c4701c6a56d8952e5aba7a420f871c8b70b57da94eb4f142dcdf7295bb0be3 \
            --directory /repo/infra/bicep \
            --framework bicep \
            --skip-path /repo/infra/bicep/mcp.bicep \
            --skip-check CKV_AZURE_35,CKV_AZURE_43,CKV_AZURE_59,CKV_AZURE_139,CKV_AZURE_163,CKV_AZURE_166,CKV_AZURE_206 \
            --quiet \
            --compact
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            bridgecrew/checkov:3.3.17@sha256:41c4701c6a56d8952e5aba7a420f871c8b70b57da94eb4f142dcdf7295bb0be3 \
            --file /repo/mcp.arm.json \
            --framework arm \
            --quiet \
            --compact